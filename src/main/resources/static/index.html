<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Secure PDF Player</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; font: 14px/1.5 system-ui, sans-serif;
      background: #0f1115; color: #e6e6e6;
    }
    header {
      display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
      padding: 12px 16px; background: #161a22; border-bottom: 1px solid #262b36;
    }
    header h1 { font-size: 15px; margin: 0 12px 0 0; font-weight: 600; }
    input, button {
      font: inherit; padding: 7px 10px; border-radius: 8px;
      border: 1px solid #2b3140; background: #1d2230; color: #e6e6e6;
    }
    input { min-width: 120px; }
    button { cursor: pointer; background: #2d6cdf; border-color: #2d6cdf; color: #fff; }
    button.secondary { background: #1d2230; color: #e6e6e6; }
    button:disabled { opacity: .45; cursor: default; }
    .spacer { flex: 1; }
    #stage {
      display: flex; flex-direction: column; align-items: center;
      padding: 20px; gap: 14px;
    }
    #pageCanvas {
      max-width: 100%; background: #fff; border-radius: 6px;
      box-shadow: 0 6px 30px rgba(0,0,0,.5);
    }
    .nav { display: flex; gap: 10px; align-items: center; }
    #pageInfo { min-width: 120px; text-align: center; opacity: .85; }
    #msg { padding: 6px 16px; min-height: 22px; color: #ffcf7a; font-size: 13px; }
    .pill { font-size: 12px; opacity: .7; }
    fieldset { border: 1px solid #2b3140; border-radius: 8px; padding: 6px 10px; }
    legend { font-size: 11px; opacity: .6; padding: 0 4px; }
  </style>
</head>
<body>
  <header>
    <h1>🔒 Secure PDF Player</h1>

    <fieldset>
      <legend>auth</legend>
      <input id="token" value="demo-secret-token" title="Bearer token"/>
    </fieldset>

    <fieldset>
      <legend>upload a document</legend>
      <input type="file" id="file"
             accept=".pdf,.txt,.md,.csv,.log,.html,.htm,.docx,.doc,.pptx,.ppt"/>
      <button id="uploadBtn">Upload &amp; process</button>
    </fieldset>

    <fieldset>
      <legend>open a book</legend>
      <input id="bookId" placeholder="book id"/>
      <button id="openBtn" class="secondary">Open</button>
    </fieldset>

    <span class="spacer"></span>
    <span class="pill" id="cacheInfo"></span>
  </header>

  <div id="msg"></div>

  <div id="stage">
    <canvas id="pageCanvas" width="800" height="1000"></canvas>
    <div class="nav">
      <button id="prevBtn" class="secondary">◀ Prev</button>
      <span id="pageInfo">—</span>
      <button id="nextBtn" class="secondary">Next ▶</button>
    </div>
  </div>

  <script src="viewer.js"></script>
</body>
</html>
